</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["wave","plan","cheer","alert"],"default":"wave"},"size":{"editor":"int","min":40,"max":600,"default":220},"$preview":{"width":220,"height":242}}'>
class Component extends DCLogic {
renderVals() {
const pose = this.props.pose ?? 'wave';
const size = Number(this.props.size ?? 220);
return {
w: size + 'px',
h: Math.round(size * 1.1) + 'px',
isWave: pose === 'wave',
isPlan: pose === 'plan',
isCheer: pose === 'cheer',
isAlert: pose === 'alert'
};
}
}
</script>
