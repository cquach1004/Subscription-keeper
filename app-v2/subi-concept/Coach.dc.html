<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["scout","doc","ref"],"default":"scout"},"size":{"editor":"int","min":40,"max":600,"default":220},"$preview":{"width":220,"height":242}}'>
class Component extends DCLogic {
renderVals() {
const role = this.props.role ?? 'scout';
const size = Number(this.props.size ?? 220);
return { w: size + 'px', h: Math.round(size * 1.1) + 'px', isScout: role === 'scout', isDoc: role === 'doc', isRef: role === 'ref' };
}
}
</script>
