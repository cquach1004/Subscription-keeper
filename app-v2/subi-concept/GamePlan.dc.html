<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your game plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#142f73}a:hover{color:#0b1c48}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f3f6fc; color: #142f73; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-grow: 1; overflow-y: auto; padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Welcome.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: #ffffff">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="#142f73" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
<div style="font-size: 14px; font-weight: 800; color: #3b4f86">{{progress}}</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex-shrink: 0">
<sc-if value="{{anyDone}}" hint-placeholder-val="{{false}}">
<dc-import name="Subi" pose="cheer" size="118" hint-size="118px,130px"></dc-import>
</sc-if>
<sc-if value="{{noneDone}}" hint-placeholder-val="{{true}}">
<dc-import name="Subi" pose="plan" size="118" hint-size="118px,130px"></dc-import>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 900; line-height: 1.05">Your game plan</h1>
<div style="background: #ffffff; border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: 15px; font-weight: 700; line-height: 1.35">{{subiSays}}</div>
</div>
</div>
<div style="background: #142f73; border-radius: 22px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 800; color: #c9d6f5">You could save</div>
<div style="font-size: 36px; font-weight: 900; color: #4ade80; line-height: 1.05">[$X] a year</div>
</div>
<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#ffc93c" stroke="#ffffff" stroke-width="3"></circle><text x="24" y="32" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="22" fill="#142f73">$</text></svg>
</div>
<sc-for list="{{plays}}" as="p" hint-placeholder-count="3">
<div style="{{p.card}}">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="{{p.badge}}">{{p.num}}</div>
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<div style="font-size: 18px; font-weight: 900; line-height: 1.2">{{p.title}}</div>
<div style="font-size: 14px; font-weight: 600; color: #3b4f86; line-height: 1.4">{{p.why}}</div>
<div style="font-size: 15px; font-weight: 900; color: #1a7a43">{{p.save}}</div>
</div>
</div>
<sc-if value="{{p.open}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 8px; margin-top: 12px">
<button type="button" onClick="{{p.done}}" style="flex-grow: 1; height: 44px; border-radius: 12px; border: none; background: #142f73; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 900; cursor: pointer">Done it</button>
<button type="button" onClick="{{p.skip}}" style="flex-grow: 1; height: 44px; border-radius: 12px; border: 2px solid #c7d2ec; background: #ffffff; color: #142f73; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Not for me</button>
</div>
</sc-if>
<sc-if value="{{p.isDone}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 10px; font-size: 15px; font-weight: 900; color: #1a7a43">Nice play! Marked as done.</div>
</sc-if>
<sc-if value="{{p.isSkip}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 10px; font-size: 15px; font-weight: 800; color: #3b4f86">Got it. I won't bring this one up again.</div>
</sc-if>
</div>
</sc-for>
<div style="background: #ffffff; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 16px; font-weight: 900">Keep these, they're a good deal</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 12px; border-radius: 999px; background: #eafbf0; font-size: 14px; font-weight: 800">[Service A]</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #eafbf0; font-size: 14px; font-weight: 800">[Service B]</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #eafbf0; font-size: 14px; font-weight: 800">[Service C]</span>
</div>
</div>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #dfe6f5; padding: 8px 6px 18px">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #142f73; font-size: 12px; font-weight: 900">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5" fill="#4ade80" stroke="#142f73" stroke-width="2"></rect><path d="M9 10l1.6 1.6L14 8.2M9 15h6" fill="none" stroke="#142f73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
My Plan</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #3b4f86; font-size: 12px; font-weight: 800">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#3b4f86" stroke-width="2"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="none" stroke="#3b4f86" stroke-width="2" stroke-linejoin="round"></path></svg>
Explore</a>
<a href="Alert.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #3b4f86; font-size: 12px; font-weight: 800">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="#3b4f86" stroke-width="2" stroke-linejoin="round"></path><circle cx="18" cy="5" r="4" fill="#ffc93c" stroke="#142f73" stroke-width="1.5"></circle></svg>
Alerts</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #3b4f86; font-size: 12px; font-weight: 800">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="#3b4f86" stroke-width="2"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="#3b4f86" stroke-width="2" stroke-linecap="round"></path></svg>
Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { s: {} }; }
renderVals() {
const list = [
{ id: 'a', title: 'Switch [Streaming service] to its plan with ads', why: 'You watch a few nights a week. Same shows, lower price.', save: 'Save [$X] a year' },
{ id: 'b', title: 'Cancel [Music service]', why: 'Your phone plan already includes it, so you are paying twice.', save: 'Save [$X] a year' },
{ id: 'c', title: 'Try your free library card', why: 'Your local library lends e-books and audiobooks free. It could replace [Audiobook service].', save: 'Save [$X] a year' }
];
const s = this.state.s;
const set = (id, v) => this.setState({ s: { ...s, [id]: v } });
const doneCount = list.filter((x) => s[x.id] === 'done').length;
const handled = list.filter((x) => s[x.id]).length;
return {
progress: doneCount + ' of ' + list.length + ' plays done',
anyDone: doneCount > 0,
noneDone: doneCount === 0,
subiSays: handled === list.length ? 'That’s the whole plan. I’ll ping you if anything changes.' : (doneCount > 0 ? 'Boom! Keep it rolling.' : 'Three plays for you. Start with number 1.'),
plays: list.map((x, i) => {
const st = s[x.id];
return {
...x,
num: String(i + 1),
open: !st,
isDone: st === 'done',
isSkip: st === 'skip',
card: 'background: #ffffff; border-radius: 20px; padding: 16px; ' + (st === 'done' ? 'border: 3px solid #4ade80;' : 'border: 2px solid #dfe6f5;') + (st === 'skip' ? ' opacity: 0.7;' : ''),
badge: 'flex-shrink: 0; width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; ' + (st === 'done' ? 'background: #4ade80; color: #142f73;' : 'background: #142f73; color: #ffffff;'),
done: () => set(x.id, 'done'),
skip: () => set(x.id, 'skip')
};
})
};
}
}
</script>
</body>
</html>
