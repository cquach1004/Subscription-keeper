<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoSuBi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#142f73">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #142f73; --green: #4ade80; --green-ink: #1a7a43; --yellow: #ffc93c; --pink: #ff8fa8;
  --bg: #f3f6fc; --card: #ffffff; --ink: #142f73; --ink-2: #3b4f86; --line: #dfe6f5; --line-2: #c7d2ec;
  --soft: #eef3ff; --good-soft: #eafbf0; --warn-soft: #fff4d1; --hero: #142f73; --hero-ink: #ffffff; --hero-2: #c9d6f5;
  --btn: #142f73; --btn-ink: #ffffff; --shadow: 0 2px 0 #dfe6f5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1633; --card: #14234a; --ink: #eef2ff; --ink-2: #b5c3e8; --line: #24376a; --line-2: #34498a;
    --soft: #1b2d5c; --good-soft: #143a2c; --warn-soft: #3a3214; --hero: #0e1d45; --hero-ink: #ffffff; --hero-2: #b5c3e8;
    --btn: #4ade80; --btn-ink: #0b1633; --green-ink: #4ade80; --shadow: 0 2px 0 #0a1430; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1633; --card: #14234a; --ink: #eef2ff; --ink-2: #b5c3e8; --line: #24376a; --line-2: #34498a;
  --soft: #1b2d5c; --good-soft: #143a2c; --warn-soft: #3a3214; --hero: #0e1d45; --hero-ink: #ffffff; --hero-2: #b5c3e8;
  --btn: #4ade80; --btn-ink: #0b1633; --green-ink: #4ade80; --shadow: 0 2px 0 #0a1430; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; overflow-x: clip; }
body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 900; line-height: 1.12; }
p { margin: 0; line-height: 1.45; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 560px; margin: 0 auto; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1 1 auto; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top { background: var(--hero); color: var(--hero-ink); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 21px; text-decoration: none; color: var(--hero-ink); background: none; border: 0; padding: 0; cursor: pointer; }
.brand b { color: var(--green); font-weight: 900; }
.tabs-top { display: none; margin-left: auto; gap: 4px; }
.tabs-top button { background: none; border: 0; color: var(--hero-2); font-weight: 800; font-size: 16px; padding: 10px 14px; border-radius: 12px; cursor: pointer; position: relative; }
.tabs-top button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; }
.dot { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--yellow); color: #142f73; font-size: 11px; font-weight: 900; display: grid; place-items: center; padding: 0 4px; }

/* bottom nav (phones) */
.tabs-bot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); }
.tabs-bot button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 800; color: var(--ink-2); cursor: pointer; position: relative; min-height: 48px; }
.tabs-bot button[aria-current="page"] { color: var(--ink); font-weight: 900; }
.tabs-bot button[aria-current="page"] .ti { background: var(--green); color: #142f73; }
.ti { width: 40px; height: 26px; border-radius: 13px; display: grid; place-items: center; }
.ti svg { width: 22px; height: 22px; }
.tabs-bot .dot { top: 0; right: calc(50% - 26px); }
main { padding: 20px 0 110px; }
@media (min-width: 860px) {
  .tabs-top { display: flex; }
  .tabs-bot { display: none; }
  main { padding-bottom: 48px; }
}

/* building blocks */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none; text-align: center; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 900; }
.btn.go { background: var(--green); color: #142f73; border-color: var(--green); font-weight: 900; box-shadow: 0 4px 0 #22a35a; }
.btn.go:active { transform: translateY(2px); box-shadow: 0 2px 0 #22a35a; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; background: var(--soft); color: var(--ink); }
.pill.price { background: var(--yellow); color: #142f73; }
.pill.new { background: var(--green); color: #142f73; }
.pill.policy { background: var(--line); color: var(--ink); }
.pill.free { background: var(--good-soft); color: var(--green-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line-2); background: var(--card); font-weight: 800; font-size: 15px; cursor: pointer; }
.chip.more-cats { border-style: dashed; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #0b1633; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #0b1633; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 14px; font-weight: 800; color: var(--ink-2); }
.input, select.input { height: 50px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); padding: 0 14px; font-size: 17px; font-weight: 700; width: 100%; }
.input:focus-visible, .btn:focus-visible, .chip:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.eyebrow { font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; color: #fff; font-weight: 900; font-size: 14px; overflow: hidden; }
.logo svg { width: 24px; height: 24px; }
.logo.sm { width: 34px; height: 34px; border-radius: 10px; font-size: 12px; }
.logo.sm svg { width: 18px; height: 18px; }

/* Subi + speech */
.coach { display: flex; align-items: flex-end; gap: 6px; }
.coach .subi { flex: 0 0 auto; }
.bubble { position: relative; background: var(--card); color: var(--ink); border-radius: 20px 20px 20px 6px; padding: 12px 16px; font-size: 16px; font-weight: 700; line-height: 1.4; border: 2px solid var(--line); margin-bottom: 18px; }
.top-hero .bubble { border-color: transparent; }
.subi svg { display: block; width: 100%; height: 100%; }
.subi.bob { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: pop .45s ease-out; }
@media (prefers-reduced-motion: reduce) { .subi.bob, .pop { animation: none; } }

/* welcome */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 0 0 32px 32px; padding: 18px 0 0; }
.hero .coach { padding-top: 6px; }
.hero .bubble { border-color: transparent; }
.welcome { padding: 28px 0 40px; display: flex; flex-direction: column; gap: 22px; }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line-2); background: var(--card); text-align: left; cursor: pointer; }
.choice[aria-pressed="true"] { border: 3px solid var(--navy); background: var(--good-soft); }
:root[data-theme="dark"] .choice[aria-pressed="true"] { border-color: var(--green); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .choice[aria-pressed="true"] { border-color: var(--green); } }
.choice .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; flex: 0 0 auto; }
.choice .ic svg { width: 26px; height: 26px; }
.choice b { display: block; font-size: 18px; font-weight: 900; }
.choice span.muted { display: block; font-size: 14px; }
.check { width: 26px; height: 26px; flex: 0 0 auto; }
.steps { display: flex; gap: 6px; }
.steps i { height: 6px; flex: 1; border-radius: 3px; background: rgba(255,255,255,.22); }
.steps i.on { background: var(--green); }
.learn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.learn .card { display: flex; flex-direction: column; gap: 8px; }
.learn .card .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--good-soft); display: grid; place-items: center; }
.learn .card .ic svg { width: 24px; height: 24px; }
@media (max-width: 420px) { .learn { grid-template-columns: 1fr; } }

/* picking */
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); cursor: pointer; text-align: left; font-weight: 800; font-size: 15px; line-height: 1.2; }
.tile[aria-pressed="true"] { border: 3px solid var(--navy); background: var(--good-soft); }
:root[data-theme="dark"] .tile[aria-pressed="true"] { border-color: var(--green); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile[aria-pressed="true"] { border-color: var(--green); } }
.tile .tick { position: absolute; top: -8px; right: -8px; }
.sticky-go { position: sticky; bottom: 0; padding: 12px 0 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
.setup-row { display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { min-height: 44px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--card); font-weight: 800; font-size: 14px; cursor: pointer; padding: 4px; }
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #0b1633; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #0b1633; } }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
.money-in { position: relative; }
.money-in span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--ink-2); }
.money-in .input { padding-left: 30px; }

/* plan */
.page-head { display: flex; align-items: center; gap: 8px; }
.page-head .grow h1 { font-size: 30px; }
.save-card { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.save-card .big { font-size: 36px; font-weight: 900; color: var(--green); line-height: 1.05; }
.save-card .lab { font-size: 14px; font-weight: 800; color: var(--hero-2); }
.layout { display: grid; gap: 18px; }
@media (min-width: 860px) { .layout { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; } .side { position: sticky; top: 16px; } }
.play { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.play.done { border: 3px solid var(--green); }
.play .num { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 12px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 17px; font-weight: 900; }
:root[data-theme="dark"] .play .num { background: var(--green); color: #0b1633; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .play .num { background: var(--green); color: #0b1633; } }
.play h3 { font-size: 18px; }
.play .why { font-size: 15px; color: var(--ink-2); line-height: 1.4; }
.play .save { font-size: 16px; font-weight: 900; color: var(--green-ink); }
.play .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.play .acts .btn { flex: 1 1 120px; }
.howto { font-size: 15px; font-weight: 800; }
.badges { display: flex; flex-wrap: wrap; gap: 10px; }
.badge { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 999px; background: var(--soft); font-weight: 800; font-size: 14px; }
.badge.off { opacity: .45; }
.badge i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--yellow); color: #142f73; font-style: normal; font-weight: 900; }
details.more > summary { cursor: pointer; list-style: none; font-weight: 900; font-size: 16px; padding: 10px 0; }
details.more > summary::-webkit-details-marker { display: none; }
.keep { display: flex; flex-wrap: wrap; gap: 8px; }
.keep span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--good-soft); font-weight: 800; font-size: 14px; }

/* explore */
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; }
.search .input { padding-left: 44px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.cat { min-height: 64px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); text-align: left; cursor: pointer; font-weight: 900; font-size: 15px; line-height: 1.2; display: flex; flex-direction: column; gap: 2px; }
.cat span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.svc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.svc { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; border: 2px solid var(--line); background: var(--card); text-align: left; cursor: pointer; width: 100%; }
.svc b { font-size: 16px; font-weight: 900; display: block; }
.svc .muted { font-size: 14px; line-height: 1.35; }
.dyk { background: var(--warn-soft); border: 0; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 18, 45, .55); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 18px 16px 28px; }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: 600px; border-radius: 24px; } }
.plan-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.plan-row:first-child { border-top: 0; }
ul.feat { margin: 0; padding-left: 20px; line-height: 1.6; }

/* alerts */
.alert { display: flex; gap: 12px; align-items: flex-start; }
.alert .grow { display: flex; flex-direction: column; gap: 4px; }
.alert h3 { font-size: 17px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
@media (min-width: 860px) { .toast { bottom: 32px; } }
.foot { text-align: center; padding: 24px 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const APP_VERSION = "MoSuBi v2 preview · Build 5 · Nov 11, 2026";
const L = DATA.legacy;
const STORE = "mosubi-v2";

// ---------- catalog ----------
const CATALOG = {};
const TAGS = {};
(DATA.services.overlap_tags || []).forEach(t => TAGS[t.tag] = t);
const effMonthly = p => p.effective_monthly ?? p.price_monthly ?? (p.price_annual != null ? +(p.price_annual / 12).toFixed(2) : null);
const NO_STUDENT = p => !/student/i.test(p.name || "");   // Convention: no student group anywhere.
function addSvc(s, extra) {
  if (CATALOG[s.id]) return;
  const [color, mark] = L.COLORS[s.id] || [s.color || "#5a6a8f", s.mark || s.name.slice(0, 2)];
  const plans = (s.plans || []).map(p => ({ ...p, eff: effMonthly(p) })).filter(NO_STUDENT);
  let category = s.category;
  if (s.id === "apple_one" && category === "bundle") category = "music";
  CATALOG[s.id] = { ...s, ...extra, category, plans, color, mark };
}
DATA.services.services.forEach(s => addSvc(s, { core: true }));
DATA.alternatives.services.forEach(s => addSvc(s));
DATA["explore-extra"].services.forEach(s => addSvc(s));
DATA.regional.services.forEach(s => addSvc(s));
DATA.additions.services.forEach(s => addSvc(s));
Object.entries(DATA.alternatives.links || {}).forEach(([id, l]) => {
  const v = CATALOG[id]; if (!v) return;
  v.alternative_to = [...new Set([...(v.alternative_to || []), ...(l.alternative_to || [])])];
  v.compare = { ...(v.compare || {}), ...(l.compare || {}) };
  v.best_for = v.best_for || l.best_for; v.kind = v.kind || l.kind;
});
const ALL = Object.values(CATALOG);
const catName = c => L.CATEGORY_LABEL[c] || c.split("_").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const PROTECT = new Set([...L.PROTECTION_CATS, "car_insurance", "home_insurance"]);

// ---------- state ----------
const fresh = () => ({ v: 1, step: "intro", team: "", country: "US", region: "", subs: [], plays: {}, history: [], tab: "plan", seen: [], optIn: null, savedAt: {} });
let S;
try { S = { ...fresh(), ...JSON.parse(localStorage.getItem(STORE) || "{}") }; } catch (e) { S = fresh(); }
// Build 5: finished plays live in S.history (older previews kept "done" in S.plays; those plays simply reopen).
if (!Array.isArray(S.history)) S.history = [];
Object.keys(S.plays || {}).forEach(k => { if (S.plays[k] === "done") delete S.plays[k]; });
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
let ui = { cat: null, q: "", pickCat: "popular", pickQ: "", exCat: null, exQ: "", openMore: false };

// ---------- location ----------
const isUS = () => S.country === "US";
const currency = () => (L.COUNTRIES[S.country] || L.COUNTRIES.US)[1];
const placeName = () => isUS() ? (L.US_STATES[S.region] || "the US") : (L.COUNTRIES[S.country] || [S.country])[0];
function hereOk(v) {
  if (!isUS()) return !(L.US_ONLY.includes(v.id) || v.service_states || /^US( only|$| prices)|United States/i.test(v.regions || ""));
  if (v.service_states && S.region && !v.service_states.includes(S.region)) return false;
  return true;
}
function plansFor(v) {
  const loc = DATA["location-prices"].services[v.id];
  if (loc && isUS() && S.region) {
    const hit = loc.locations.find(x => x.country === "US" && x.state === S.region && !x.city);
    if (hit) return hit.plans.map(p => ({ ...p, eff: effMonthly(p) })).filter(NO_STUDENT);
  }
  return v.plans;
}
const planOf = (v, id) => plansFor(v).find(p => p.id === id) || plansFor(v)[0];
function teamPlan(v) {
  const ps = plansFor(v).filter(p => p.eff != null || !isUS());
  const f = re => ps.find(p => re.test(p.name));
  const def = ps.find(p => p.id === v.default_plan) || ps.find(p => p.eff > 0) || ps[0];
  if (S.team === "couple") return f(/\bduo\b|couple|2 accounts|two/i) || f(/family|household/i) || def;
  if (S.team === "family") return f(/family|household/i) || def;
  return f(/individual/i) || def;
}

// ---------- money ----------
const fmt = (n, d) => n == null ? "" : new Intl.NumberFormat("en-US", { style: "currency", currency: currency(), minimumFractionDigits: d ?? (Math.round(n) === n ? 0 : 2), maximumFractionDigits: d ?? 2 }).format(n);

// ---------- the game plan: plays built only from catalog data and what the user told us ----------
const OVERLAP_TAGS = ["ai_assistant", "cloud_storage", "vpn", "password_manager", "identity_monitoring", "data_removal", "email_alias", "notes", "business_news", "music", "antivirus", "roadside"];
const featTags = (v, planId) => new Set((v.features || []).filter(f => f.overlap_tag && (f.plans === "all" || (Array.isArray(f.plans) && f.plans.includes(planId)))).map(f => f.overlap_tag));

const bundleName = n => /\/|bundle|,| \+ /i.test(n);
function buildPlays() {

  for (const { s, v } of subs) {
    const price = subPrice(s); if (!price) continue;
    const cur = planOf(v, s.plan); const ps = plansFor(v).filter(p => p.eff != null && p.id !== (cur && cur.id));
    const prot = PROTECT.has(v.category);
    // 1. Rarely used: cancel (never for insurance, roadside or protection; those get "shop around").
    if (s.use === "rare" && !prot) out.push({ id: "cancel:" + s.id, svc: [s.id], kind: "cancel", save: price * 12,
      title: `Cancel ${v.name}`, why: `You said you rarely use it, so that's ${yr(price * 12)} a year for something you hardly touch. You can always sign up again later.`, url: v.official_url, how: "Go to your account settings and turn off auto-renew." });
    // 2. Plan bigger than the household.
    if (S.team === "me" && cur && /family|duo|household|premier|2 accounts/i.test(cur.name)) {
      const solo = ps.filter(p => /individual|standard|personal|basic/i.test(p.name) && !bundleName(p.name) && p.eff < price).sort((a, b) => b.eff - a.eff)[0];
      if (solo) out.push({ id: "solo:" + s.id, svc: [s.id], kind: "switch", to: solo.id, save: (price - solo.eff) * 12,
        title: `Switch ${v.name} to ${solo.name}`, why: `You're on ${cur.name}, but it's just you. ${solo.name} is ${fmt(solo.eff)} a month.`, url: v.official_url, how: "Change plan in your account settings. The new price starts at your next bill." });
    }
    // 3. A plan with ads (shows and movies) for people who don't watch a lot.
    if (v.category === "video" && s.use !== "lot" && cur && !/ads/i.test(cur.name)) {
      const ads = ps.filter(p => /with ads|\(ads\)/i.test(p.name) && !bundleName(p.name) && p.eff > 0 && p.eff < price).sort((a, b) => a.eff - b.eff)[0];
      if (ads) out.push({ id: "ads:" + s.id, svc: [s.id], kind: "switch", to: ads.id, save: (price - ads.eff) * 12,
        title: `Switch ${v.name} to ${ads.name}`, why: `Same shows, a few ads, ${fmt(ads.eff)} a month. A good trade if you don't watch every night.`, url: v.official_url, how: "Change plan in your account settings." });
    }
    // 4. Pay yearly, where the yearly price is lower.
    if (s.billing !== "yearly" && cur && cur.price_monthly && cur.price_annual && cur.price_annual < cur.price_monthly * 12 - 1)
      out.push({ id: "yearly:" + s.id, svc: [s.id], kind: "yearly", save: cur.price_monthly * 12 - cur.price_annual,
        title: `Pay for ${v.name} yearly`, why: `If you pay monthly, the yearly price of ${fmt(cur.price_annual)} works out cheaper. Only worth it if you're keeping it all year.`, url: v.official_url, how: "Look for annual billing in your plan settings." });
    // 5. A free option that does the same job (libraries and city services first).

        .sort((a, b) => (b.provider_type ? 1 : 0) - (a.provider_type ? 1 : 0))[0];

          title: `Try ${free.name}, it's free`, why: (cmp && cmp.summary) || free.best_for || `A free option that can stand in for ${v.name}.`, url: free.finder_url || free.official_url,

    const keep = priced[0], drop = priced.slice(1).filter(x => !(x.v.category === "bundle" || x.v.id === "apple_one" || x.v.id === "amazon_prime" || x.v.id === "google_ai_pro" || x.v.id === "m365") || priced.length > 2);
    const d = drop.sort((a, b) => subPrice(b.s) - subPrice(a.s))[0]; if (!d) return;

      how: `Move anything you need over to ${keep.v.name} first, then cancel ${d.v.name}.` });

}
function planSummary() {
  const plays = buildPlays();
  const open = plays.filter(p => !S.plays[p.id]);

  open.forEach(p => p.svc.forEach(id => { bestBySub[id] = Math.max(bestBySub[id] || 0, p.save); }));
  const couldSave = Object.values(bestBySub).reduce((a, b) => a + b, 0);
  const saved = S.history.reduce((a, h) => a + (h.save || 0), 0);
  // Lead plays: the single best open play for each subscription, best first. Subi calls 3 plays at a time.
  const seen = new Set(), lead = [], more = [];
  open.forEach(p => { const k = p.svc[0]; if (seen.has(k) || lead.length >= 3) more.push(p); else { seen.add(k); lead.push(p); } });
  const withPlays = new Set(open.flatMap(p => p.svc));
  const keep = S.subs.filter(s => !withPlays.has(s.id) && CATALOG[s.id]);
  return { plays, open, lead, more, couldSave, saved, keep, done: S.history };
}

const kindOf = t => /same price|added|launch|new |now includes|coming to/i.test(t) ? "new" : /rose|raise|increase|hike|up \$|\bup\b.*\$|fees/i.test(t) ? "price" : "policy";

    const so = (v.sources || [])[0]; const named = so && typeof so === "object";

    ${v.best_for ? `<p>${esc(v.best_for)}</p>` : ""}
    ${v.service_states ? `<p class="small muted">Serves ${esc(v.service_states.map(s => L.US_STATES[s] || s).join(", "))}.</p>` : ""}
    <div class="card"><b>Plans</b>${ps.map(p => `<div class="plan-row"><span>${esc(p.name)}${p.note ? `<div class="tiny muted">${esc(p.note)}</div>` : ""}</span><b style="white-space:nowrap">${p.eff === 0 ? "Free" : p.eff != null && isUS() ? fmt(p.eff) + "/mo" : "Ask for a quote"}</b></div>`).join("")}
      <p class="tiny muted" style="margin-top:8px">${isUS() ? `US prices before tax${v.checked_at ? `, checked ${esc(fmtDate(v.checked_at))}` : ""}.` : "Prices are checked for the US. Yours may differ."}</p></div>
    ${(v.features || []).length ? `<div class="card"><b>What you get</b><ul class="feat">${v.features.slice(0, 8).map(f => `<li>${esc(f.name)}</li>`).join("")}</ul></div>` : ""}
    ${alts.length ? `<div class="col"><b>Alternatives</b><div class="svc-list">${alts.map(svcCard).join("")}</div></div>` : ""}
    <div class="row" style="flex-wrap:wrap">${on ? `<span class="pill new">On your list</span>` : `<button class="btn go" data-act="addFromSheet" data-v="${id}">Add to my list</button>`}${v.official_url || v.finder_url ? `<a class="btn" href="${esc(v.finder_url || v.official_url)}" target="_blank" rel="noopener">Visit site ${ICON.out}</a>` : ""}</div>
  </div></div>`;
  setTimeout(() => { const b = $("#sheet .sheet button"); b && b.focus(); }, 0);
}
const closeSheet = () => { $("#sheet").innerHTML = ""; };

// ----- Alerts -----
function alertsView() {
  const xs = alertsFor();
  const head = `<div class="page-head">${subi("alert", 100, true)}<div class="grow col" style="gap:6px"><h1>Alerts</h1><div class="bubble" style="margin:0">${xs.length ? `Here's what changed for the services you have. I'll flag new ones here first.` : `All quiet for your subscriptions. I'll let you know the moment something changes.`}</div></div></div>`;
  const opt = S.optIn ? `<div class="card col"><div class="row">${ICON.check}<div class="grow"><b>Alerts are on</b><div class="small muted">Sending to ${esc(S.optIn.email)}</div></div><button class="btn ghost sm" data-act="optOut">Turn off</button></div><p class="tiny muted">Preview: emails are not sent yet. In the live app, Subi will email you when something here changes.</p></div>`
    : `<form class="card col" data-form="optin"><b style="font-size:18px">Get a heads-up by email</b><p class="small muted">Price increases, new features and policy changes for what you have. Nothing else, and it's free.</p>
      <div class="field"><label for="em">Email</label><input id="em" class="input" type="email" required autocomplete="email" placeholder="you@example.com"></div><button class="btn primary" type="submit">Turn on alerts</button>
      <p class="tiny muted">Preview: this is saved in this browser only, and no emails are sent yet.</p></form>`;
  return `<div class="layout"><div class="col" style="gap:14px">${head}
    ${xs.map(a => { const v = CATALOG[a.svc]; const [lab, cls] = KIND[a.kind];
      return `<article class="card alert">${logo(v)}<div class="grow"><div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill ${cls}">${lab}</span><span class="tiny muted">${esc(fmtDate(a.date))}</span></div>
        <h3>${esc(a.title === v.name ? v.name : a.title)}</h3><p class="small">${esc(a.text)}</p>
        <p class="tiny muted">Source: ${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.src)}</a>` : esc(a.src)}</p>
        ${a.kind === "price" ? `<div><button class="btn sm" data-act="tab" data-v="plan">See my plays</button></div>` : ""}</div></article>`; }).join("")}
    ${!S.subs.length ? `<button class="btn go" data-act="addMore">Add my subscriptions</button>` : ""}
  </div><aside class="side col">${opt}</aside></div>`;
}

// ----- Me -----
function meView() {
  const T = { me: "Just me", couple: "Me + my partner", family: "Family with kids" };
  return `<div class="narrow col" style="gap:16px"><div class="page-head">${subi("wave", 90, true)}<div class="grow"><h1>Me</h1></div></div>
    <div class="card col"><b>Your team</b><div class="chips">${Object.entries(T).map(([k, l]) => `<button class="chip" data-act="team" data-v="${k}" aria-pressed="${S.team === k}">${l}</button>`).join("")}</div></div>
    <div class="card col"><b>Where you live</b>
      <div class="field"><label for="country2">Country</label><select id="country2" class="input" data-chg="country">${Object.entries(L.COUNTRIES).map(([k, [n]]) => `<option value="${k}" ${S.country === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
      ${isUS() ? `<div class="field"><label for="region2">State</label><select id="region2" class="input" data-chg="region"><option value="">Choose your state</option>${Object.entries(L.US_STATES).map(([k, n]) => `<option value="${k}" ${S.region === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>` : ""}</div>
    <div class="card col"><div class="row"><b class="grow">Your subscriptions (${S.subs.length})</b><button class="btn sm" data-act="addMore">Add or change</button></div>
      ${S.subs.map(s => { const v = CATALOG[s.id]; if (!v) return ""; const p = planOf(v, s.plan); const pr = subPrice(s);
        return `<div class="row">${logo(v, "logo sm")}<span class="grow"><b>${esc(v.name)}</b><div class="tiny muted">${esc(p ? p.name : "")}</div></span><b>${pr != null ? fmt(pr) + "/mo" : ""}</b></div>`; }).join("")}</div>
    <div class="card col"><b>Look</b><div class="chips">${[["", "Match my device"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => `<button class="chip" data-act="theme" data-v="${k}" aria-pressed="${(S.theme || "") === k}">${l}</button>`).join("")}</div></div>
    ${ui.confirmReset ? `<div class="card col"><b>Start over?</b><p class="small muted">This clears your subscriptions and plays in this browser.</p><div class="row"><button class="btn primary" data-act="resetYes">Yes, start over</button><button class="btn" data-act="resetNo">Keep my plan</button></div></div>` : `<button class="btn" data-act="reset">Start over</button>`}
    <p class="tiny muted foot">${esc(APP_VERSION)}. Prices come from MoSuBi's checked catalog; "about" amounts are estimates.</p></div>`;
}

// ---------- actions ----------
function toast(msg, pose = "cheer") {
  const t = $("#toast"); t.innerHTML = `<div class="toast pop">${subi(pose, 40)}<span>${msg}</span></div>`;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = "", 2600);
}
const go = () => { save(); render(); };
const toTop = () => window.scrollTo(0, 0);
function addSub(id) {
  if (S.subs.some(s => s.id === id)) return;
  const v = CATALOG[id]; const p = teamPlan(v);
  S.subs.push({ id, plan: p && p.id, price: null, use: "some" });
}
// Done it: apply the play to the list (cancel = off the list, switch = new plan, yearly = paid yearly) and file it under History.
function finishPlay(id) {
  const p = buildPlays().find(x => x.id === id); if (!p) return;
  const s = S.subs.find(x => x.id === p.svc[0]); if (!s) return;
  const before = { ...s }, v = CATALOG[s.id];
  let effect, added = null;
  if (p.kind === "switch" && p.to) { s.plan = p.to; s.price = null; effect = "switched"; }
  else if (p.kind === "yearly") { s.billing = "yearly"; s.price = null; effect = "yearly"; }
  else { S.subs = S.subs.filter(x => x.id !== s.id); effect = "removed";
    if (p.alt && !S.subs.some(x => x.id === p.alt)) { addSub(p.alt); added = p.alt; } }
  S.history.unshift({ id: p.id, svc: s.id, title: p.title, save: p.save, kind: p.kind, effect, added, at: new Date().toISOString(), before });
  S.lastDone = Date.now(); go();
  toast(effect === "removed" ? `Nice play! ${v.name} is off your list and in History.` : `Nice play! That's about ${yr(p.save)} a year.`);
}
function undoPlay(i) {
  const h = S.history[i]; if (!h) return;
  if (h.added) S.subs = S.subs.filter(x => x.id !== h.added);
  const at = S.subs.findIndex(x => x.id === h.svc);
  if (at >= 0) S.subs[at] = h.before; else S.subs.push(h.before);
  S.history.splice(i, 1); go(); toast("Undone. It's back in your game plan.", "wave");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "step") { S.step = v; go(); toTop(); }
  else if (a === "home") { if (S.step === "done") { S.tab = "plan"; ui.exCat = null; } go(); toTop(); }
  else if (a === "exploreFirst") { S.step = "done"; S.tab = "explore"; if (!S.team) S.team = "me"; go(); toTop(); }
  else if (a === "team") { S.team = v; S.subs.forEach(s => { if (s.price == null || s.price === "") { const p = teamPlan(CATALOG[s.id]); if (p) s.plan = p.id; } }); go(); }
  else if (a === "moreCats") { ui.moreCats = !ui.moreCats; render(); }
  else if (a === "pickCat") { ui.pickCat = v; ui.pickQ = ""; render(); }
  else if (a === "toggle") { const i = S.subs.findIndex(s => s.id === v); if (i >= 0) S.subs.splice(i, 1); else addSub(v); save();
    const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === "remove") { S.subs = S.subs.filter(s => s.id !== v); go(); }
  else if (a === "use") { const s = S.subs.find(x => x.id === v); s.use = b.dataset.u; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === "finish") { S.step = "done"; S.tab = "plan"; go(); toTop(); toast("Your game plan is ready!", "plan"); }
  else if (a === "tab") { S.tab = v; ui.exCat = null; go(); toTop(); }
  else if (a === "done") { finishPlay(v); }
  else if (a === "planTab") { ui.planTab = v; render(); toTop(); }
  else if (a === "unskip") { Object.keys(S.plays).forEach(k => { if (S.plays[k] === "skip") delete S.plays[k]; }); ui.planTab = "plan"; go(); }
  else if (a === "skip") { S.plays[v] = "skip"; go(); toast("Got it. I won't bring that one up again.", "wave"); }
  else if (a === "undo") { undoPlay(+v); }
  else if (a === "addMore") { S.step = "pick"; go(); toTop(); }
  else if (a === "exCat") { ui.exCat = v || null; ui.exQ = ""; render(); toTop(); }
  else if (a === "open") openSheet(v);
  else if (a === "close") closeSheet();
  else if (a === "addFromSheet") { addSub(v); save(); closeSheet(); render(); toast(`Added ${CATALOG[v].name} to your plan.`, "plan"); }
  else if (a === "optOut") { S.optIn = null; go(); }
  else if (a === "theme") { S.theme = v; applyTheme(); go(); }
  else if (a === "reset") { ui.confirmReset = true; render(); }
  else if (a === "resetNo") { ui.confirmReset = false; render(); }
  else if (a === "resetYes") { ui.confirmReset = false; S = fresh(); go(); toTop(); }
});
document.addEventListener("change", e => {
  const t = e.target, k = t.dataset.chg; if (!k) return;
  if (k === "country") { S.country = t.value; if (!isUS()) S.region = ""; S.subs = S.subs.filter(s => CATALOG[s.id] && hereOk(CATALOG[s.id])); go(); }
  else if (k === "region") { S.region = t.value; S.subs = S.subs.filter(s => CATALOG[s.id] && hereOk(CATALOG[s.id])); go(); }
  else if (k === "plan") { const s = S.subs.find(x => x.id === t.dataset.v); s.plan = t.value; s.price = null; go(); }
  else if (k === "price") { const s = S.subs.find(x => x.id === t.dataset.v); const n = parseFloat(String(t.value).replace(/[^\d.]/g, "")); const p = planOf(CATALOG[s.id], s.plan);
    s.price = isNaN(n) ? null : (isUS() && p && Math.abs(n - p.eff) < 0.005 ? null : n); save(); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset.inp; if (!k) return;
  ui[k] = e.target.value; const pos = e.target.selectionStart; render();
  const el = document.querySelector(`[data-inp="${k}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} }
});
document.addEventListener("submit", e => {
  const f = e.target; if (f.dataset.form !== "optin") return; e.preventDefault();
  const em = f.querySelector("#em").value.trim(); if (!em) return;
  S.optIn = { email: em, at: new Date().toISOString() }; go(); toast("Alerts are on. I've got your back!", "alert");
});
document.addEventListener("toggle", e => { if (e.target.dataset && e.target.dataset.tog) ui[e.target.dataset.tog] = e.target.open; }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").innerHTML) closeSheet(); });
function applyTheme() { if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
applyTheme();
render();
</script>
</body>
</html>
