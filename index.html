      ${k ? `<div class="r muted"><span>${esc(measureOf(s).short[0].toUpperCase() + measureOf(s).short.slice(1))} in the month before</span><span class="num">${fmtN(Math.round(r.uses * 10) / 10)}</span></div>` : ""}

      if (isNaN(n)) { delete s.hist[id][k]; delete s.histSrc[id][k]; } else { s.hist[id][k] = Math.max(0, n); s.histSrc[id][k] = "you"; }
      s.example = false; save(); setTimeout(draw); });
    root.querySelector("#sync-file")?.addEventListener("change", async e => { const file = e.target.files[0], msg = t => { const m = root.querySelector("#sync-msg"); if (m) m.textContent = t; }; if (!file) return;
      msg("Reading your export…"); try { await applyExport(s, file); save(); draw(); } catch (err) { msg(err.message === "zip" ? "Couldn't open the zip here. Unzip it and choose conversations.json instead." : err.message || "Couldn't read that file."); } });
    root.querySelectorAll("[data-hf]").forEach(sel => sel.onchange = () => { s.flags ||= {}; if (sel.value) s.flags[sel.dataset.hf] = { why: sel.value }; else delete s.flags[sel.dataset.hf]; save(); setTimeout(draw); });
    const sa = root.querySelector("#s-alt"); if (sa) sa.onchange = () => { if (/^\d+$/.test(sa.value)) { s.alt = +sa.value; if (s.worth) delete s.worth[measureOf(s).id]; } save(); setTimeout(draw); };
    const sw2 = root.querySelector("#s-worth");
    if (sw2) sw2.onchange = () => { const n = parseFloat(sw2.value); const id = measureOf(s).id; s.worth ||= {}; if (isNaN(n)) delete s.worth[id]; else s.worth[id] = Math.max(0, n); save(); setTimeout(draw); };
    root.querySelector("#s-worth-reset")?.addEventListener("click", () => { delete s.worth[measureOf(s).id]; save(); draw(); });
    if (hh) {
      const setM = n => { s.members = Math.min(hh.max, Math.max(1, n)); save(); setTimeout(draw); };
      root.querySelector("#m-plus").onclick = () => setM((s.members || 1) + 1);
      root.querySelector("#m-minus").onclick = () => setM((s.members || 1) - 1);
      const mf = root.querySelector("#m-fee"); if (mf) mf.onchange = e => { s.memberFee = Math.max(0, parseFloat(e.target.value) || 0); save(); setTimeout(draw); };
    }
    root.querySelector("#pz-add")?.addEventListener("click", () => { const pp = v.pause_policy || {}; (s.pauses ||= []).push({ from: today(), to: null, fee: pp.fee_while_paused || 0, restartFee: pp.restart_fee || 0 }); s.example = false; save(); draw(); });
    root.querySelector("#pz-now")?.addEventListener("click", () => { currentPause(s).to = today(); save(); draw(); });
    root.querySelectorAll("[data-pz]").forEach(inp => inp.onchange = () => { const pz = s.pauses[+inp.dataset.i], k = inp.dataset.pz;
      pz[k] = k === "fee" || k === "restartFee" ? Math.max(0, parseFloat(inp.value) || 0) : (inp.value || null); s.example = false; save(); setTimeout(draw); });
    root.querySelectorAll("[data-pz-del]").forEach(b => b.onclick = () => { s.pauses.splice(+b.dataset.pzDel, 1); save(); draw(); });
    const st = root.querySelector("#s-start");
    if (st) st.onchange = () => { s.start = st.value || null; s.example = false; save(); setTimeout(draw); };
    const ib = root.querySelector("#d-intro");
    if (ib) ib.onchange = () => { if (ib.checked) { const pl = planOf(v, s.plan), o = pl?.intro || parseIntro(pl?.intro_offer);
        const fromStart = o && s.start ? stepDate(s.start, "month", o.months) : null;
        s.intro = o ? { kind: o.kind || "intro", price: o.price, ends: fromStart && fromStart >= today() ? fromStart : addMonths(o.months) }
          : { kind: "trial", price: 0, ends: v.free_trial_days ? new Date(Date.now() + v.free_trial_days * 864e5).toISOString().slice(0, 10) : addMonths(1) }; } else s.intro = null; s.example = false; save(); setTimeout(draw); };
    [["d-kind", "kind", x => x], ["d-price", "price", x => Math.max(0, parseFloat(x) || 0)], ["d-ends", "ends", x => x]].forEach(([id, k, fn]) => {
      const el2 = root.querySelector("#" + id); if (el2) el2.onchange = () => { s.intro[k] = fn(el2.value); save(); setTimeout(draw); }; });
    root.querySelectorAll("[data-disc]").forEach(c => c.onchange = () => {
      const d = (s.discounts ||= []).find(x => x.id === c.dataset.disc);
      if (c.type === "checkbox") d.on = c.checked; else d.amount = Math.max(0, parseFloat(c.value) || 0); save(); setTimeout(draw); });
    const sw = root.querySelector("#d-switch");
    if (sw) sw.onclick = () => { s.cycle = "year"; s.price = priceFor(planOf(v, s.plan), "year"); s.priceMine = false; save(); draw(); };
    const tx = root.querySelector("#s-tax"); if (tx) tx.onchange = () => { s.noTax = !tx.checked; save(); setTimeout(draw); };
    const mine = root.querySelector("#s-mine");
    if (mine) mine.onchange = e => { const val = parseFloat(e.target.value); if (isNaN(val)) { s.priceMine = false; } else { s.myTotal = Math.max(0, val); s.priceMine = true; } s.example = false; save(); setTimeout(draw); };
    const lp = root.querySelector("#s-list");
    if (lp) lp.onclick = () => { s.priceMine = false; save(); draw(); };
    const ps = root.querySelector("#s-plan");
    if (ps) ps.onchange = () => { const p = planOf(v, ps.value); s.plan = p.id; s.cycle = defaultCycle(p); s.price = priceFor(p, s.cycle); s.priceMine = false;
      const ok = featuresFor(v, p.id).map(f => f.id); s.used = s.used.filter(f => ok.includes(f)); save(); draw(); };
    root.querySelectorAll(".feature input").forEach(c => c.onchange = () => {
      const fid = c.dataset.f; s.used = c.checked ? [...s.used, fid] : s.used.filter(x => x !== fid); save(); draw(); });
    root.querySelector("#remove").onclick = () => { state.subs = state.subs.filter(x => x !== s); save(); close(); };
    if (first) root.querySelector("#close").focus();
    first = false;
  };
  draw();
  document.onkeydown = e => { if (e.key === "Escape" && root.firstChild) { root.replaceChildren(); render(); } };
}

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { if (b.dataset.view === "explore") exploreOpen = null; view = b.dataset.view; render(); }));
document.getElementById("loc-btn").addEventListener("click", () => { view = "settings"; render(); });
document.getElementById("fb-btn").addEventListener("click", () => { if (view !== "feedback") lastView = view; fbSent = false; view = "feedback"; render(); window.scrollTo(0, 0); });
document.getElementById("view").innerHTML = `<p class="muted">Loading service prices…</p>`;
fetch("services.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => Promise.all(["alternatives.json", "explore-extra.json", "location-prices.json", "regional.json"].map(f => fetch(f).then(r => r.ok ? r.json() : {}).catch(() => ({})))).then(xs => [d, xs])).then(([d, xs]) => {
  buildCatalog(d); xs.slice(0, 2).forEach(buildAlts); LOC_PRICES = xs[2]?.services || {}; buildAlts(xs[3] || {});
  const saved = load();
  // New visitors start on the welcome screen and pick their own subscriptions; returning visitors keep their list.
  state = saved?.subs ? saved : FRESH(); if (!saved?.subs) view = "welcome";
  // Services added from Explore live in alternatives.json / explore-extra.json. If those files fail to load, keep the
  // subscription as a custom one and restore the link next time, rather than discarding the user's list.
  state.subs.forEach(s => { if (s.svcOrig && CATALOG[s.svcOrig]) { s.svc = s.svcOrig; delete s.svcOrig; }
    else if (s.svc !== "custom" && !CATALOG[s.svc]) { s.svcOrig = s.svc; s.svc = "custom"; } });
  state.subs.forEach(s => {
    if (!s.per) setUse(s, s.uses, "month");
    if (!s.measure) { s.measure = measuresOf(s)[0].id; (s.usage ||= {})[s.measure] = { rate: s.rate, per: s.per }; }
    if (!s.start) s.start = pastStart(s.cycle === "year" ? 6 : 1, s.day || 1);
    // Cuong's ChatGPT (started Mar 15, 2026; paused Sep 15 to Oct 15). Older saves got a placeholder start date.
    if (s.svc === "chatgpt" && s.start > "2026-03-15" && !state.chatgptFixed) { s.start = "2026-03-15"; if (!s.pauses?.length) s.pauses = [{ from: "2026-09-15", to: "2026-10-15", fee: 0, restartFee: 0 }]; }
    // Older saves stored the user's figure in s.price; it was meant as the whole household's price.
    if (s.priceMine && s.myTotal == null) { s.myTotal = s.price; if (CATALOG[s.svc]) s.price = priceFor(planOf(CATALOG[s.svc], s.plan), s.cycle); }
  });
  // One-time test history for the prototype; subscriptions added later start without history.
  if (state.histV !== 2) { genAll(); state.histV = 2; }
  state.chatgptFixed = true;
  if (!state.nflV) { state.subs.filter(s => s.svc === "amazon_prime" && !s.used.includes("nfl")).forEach(s => s.used = [...s.used, "nfl"]); state.nflV = 1; }
  // Subscriptions added recently with no usage entered yet wait for the user's input before any rating (one-time check).
  if (!state.needsV) { state.subs.filter(s => !s.example && !s.uses && !s.hist && s.start && dayDiff(s.start, today()) <= 45).forEach(s => s.needsUse = true); state.needsV = 1; }
  if (!state.cloakedV) { state.subs.filter(s => s.svc === "cloaked").forEach(s => { if (!s.hist?.replace) genHistory(s); switchMeasure(s, "replace"); s.used = ["data_removal"]; }); state.cloakedV = 1; }
  save();
  render();
}).catch(() => { document.getElementById("view").innerHTML = `<p class="muted">Service prices didn't load. Reload the page to try again.</p>`; });
</script>

</body></html>
