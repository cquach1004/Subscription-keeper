.co-track::before { content: ""; position: absolute; left: 6px; right: 0; top: 9px; height: 2px; border-radius: 2px; background: var(--line); }
.co-in { position: absolute; left: 6px; right: 0; top: 0; bottom: 0; }
.co-gap { position: absolute; right: 0; top: 7px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--good) 40%, transparent); }
.co-dot { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--surface); }
.co-you { position: absolute; right: 0; top: 1px; width: 3px; height: 18px; border-radius: 2px; background: var(--c-cost); }
.co-amt { font-size: 13px; text-align: right; white-space: nowrap; }
.co-save { display: block; color: var(--good); font-weight: 700; font-size: 12px; }
.co-note { grid-column: 1 / -1; margin-top: -2px; }
.co-scale { display: flex; justify-content: space-between; font-size: 11px; border-top: 1px dashed var(--line); padding-top: 6px; }
.co-key { display: flex; gap: 14px; flex-wrap: wrap; margin: -6px 0 12px; }
.co-key i { display: inline-block; vertical-align: -1px; margin-right: 6px; }
.co-key .k-you { width: 3px; height: 12px; border-radius: 2px; background: var(--c-cost); }
.co-key .k-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); }
.co-key .k-gap { width: 16px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--good) 40%, transparent); }
.co-more[open] .if-closed, .co-more:not([open]) .if-open { display: none; }
.co-more > summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 10px 0; }
.ov-sum { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.ov-sum .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.ov-key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.ov-key i, .ov-bar i { display: inline-block; border-radius: 4px; }
.ov-key i { width: 12px; height: 12px; vertical-align: -2px; margin-right: 6px; }
.ov-head { display: flex; align-items: center; gap: 12px; }
.ov-head h3 { margin: 0; flex: 1; min-width: 0; }
.ov-logos { display: flex; flex-shrink: 0; }
.ov-logos .logo { box-shadow: 0 0 0 3px var(--surface); }
.ov-logos .logo + .logo { margin-left: -12px; }
.ov-rows { display: grid; gap: 6px; }
.ov-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; gap: 10px; align-items: center; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ov-row .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-bar { height: 14px; display: flex; align-items: center; }
.ov-bar i { height: 14px; min-width: 4px; }
.ov-row .amt { font-size: 13px; white-space: nowrap; text-align: right; }
.ov-row .drop { color: var(--c-cost); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; display: block; }
details.ov-why > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; }
details.ov-why p { margin: 8px 0 0; font-size: 14px; }
.ctip .r { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.ctip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; justify-self: start; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.mine-worth { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.mine-worth input { width: 100px; }
.alt { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.alt-top { display: flex; align-items: center; gap: 10px; }
.alt-top .logo { width: 32px; height: 32px; border-radius: 8px; font-size: 12px; flex: none; }
.months { display: grid; border-top: 1px solid var(--line); }
.mrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.mrow.flagged { box-shadow: inset 3px 0 0 var(--warn); padding-left: 10px; }
.mrow select { grid-column: 1 / -1; width: auto; justify-self: start; padding: 5px 8px; font-size: 13px; }
.mval { display: flex; align-items: center; gap: 6px; }
.mval input { width: 84px; padding: 6px 8px; }
.slide { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 14px; }
.slide input[type=range] { padding: 0; border: 0; background: none; height: 28px; accent-color: var(--accent); cursor: pointer; }
.slide input.usual { opacity: .55; }
.slide output { min-width: 3.4em; text-align: right; font-size: 20px; font-weight: 600; }
.slide-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.mrow .slide { grid-column: 1 / -1; }
.mrow .slide output { font-size: 16px; }
.mrow .slide-ends { display: none; }
.checks { display: grid; gap: 6px; margin-top: 8px; } .checks .feature { color: var(--ink); font-weight: 500; border: 0; padding: 0; display: flex; gap: 8px; align-items: center; font-size: 14px; }
.mrow .checks, .u-row .checks { grid-column: 1 / -1; margin-top: 2px; }
.mact { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.mrow .mact select { grid-column: auto; }
details.nums > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; }
details.nums table { margin-top: 6px; }
.pz { display: grid; gap: 6px; padding-block: 6px; border-top: 1px solid var(--line); }
.pz:first-of-type { border-top: 0; }
.disc { display: flex; align-items: center; gap: 8px; font-size: 14px; }
input[type=checkbox] { width: 18px; height: 18px; flex: none; padding: 0; accent-color: var(--accent); }
label.disc { font-weight: 500; }

/* Look (Cuong, 2026-10-20): modeled on the Cloaked app, in light blue. Soft sky glow behind the top of the page,
   a serif greeting, big light numbers, borderless rounded cards, and a floating glass tab bar on phones. */
body { position: relative; min-height: 100vh; overflow-x: hidden; margin: 0; }
.stat, .card, .list, .upcoming { background-origin: border-box; }
body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 600px; z-index: -1; pointer-events: none; background: var(--band);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 42%, rgba(0,0,0,.75) 58%, rgba(0,0,0,.35) 78%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, #000 42%, rgba(0,0,0,.75) 58%, rgba(0,0,0,.35) 78%, transparent 100%); }
/* Other screens: a navy band behind the header only, fading out before the page title. */
body.short-band::before { display: none; }
/* The band below reaches 100vw past each side; clip it so phones never scroll sideways (v111). */
html, body { overflow-x: clip; }
body.short-band header.top { position: relative; margin-bottom: 44px; }
body.short-band header.top::before { content: ""; position: absolute; left: -100vw; right: -100vw; top: -60px; bottom: -44px; z-index: -1; pointer-events: none; background: var(--band);
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 60px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 60px), transparent); }
.wrap { padding-top: 22px; }
header.top { margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
header.top nav.tabs { grid-column: 1 / -1; justify-self: start; }
.avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); padding: 0; display: grid; place-items: center;
  font: 600 15px var(--f-body); color: #fff; background: linear-gradient(150deg, #4f6fd0, #1e3a8a); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.avatar svg { width: 22px; height: 22px; }
.me-sheet { grid-auto-rows: max-content; grid-template-rows: none; align-content: start; }
.me-item input.me-check { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.me-sheet .me-head { display: flex; align-items: center; gap: 14px; }
.me-sheet .avatar { width: 56px; height: 56px; font-size: 20px; border-color: var(--line); }
.me-list { background: var(--surface); border-radius: 20px; box-shadow: var(--card-shadow); overflow: hidden; }
.me-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.me-item:first-child { border-top: 0; }
button.me-item:hover { background: var(--accent-soft); }
.me-item .me-l { flex: 1; min-width: 0; font-weight: 500; }
.me-item select { width: auto; flex: none; max-width: 55%; }
.me-item .me-v { color: var(--muted); font-size: 14px; text-align: right; }
.me-item svg.ic { width: 20px; height: 20px; color: var(--accent); flex: none; }
.me-item.chev::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); flex: none; }
header.top h1 { font: 700 24px var(--f-body); letter-spacing: -.01em; color: var(--hero-ink); }  /* v183 (Cuong): bigger logo and name */
.proto, .loc { background: var(--glass); border-color: transparent; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.loc { padding: 6px 14px; }
.hero { padding: 34px 0 26px; }
.hero h2 { font: 300 clamp(40px, 9vw, 60px)/1.04 var(--f-serif); letter-spacing: -.02em; color: var(--hero-ink); }
.hero p { margin: 10px 0 0; color: var(--hero-ink); opacity: .75; font-size: 16px; }
.section-head h2 { font: 400 26px/1.15 var(--f-serif); letter-spacing: -.01em; }
.section-head { margin: 26px 0 12px; }
h3 { font-weight: 600; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.stat, .list, .card, .upcoming, form.fields, .tbl-wrap, .cat-item, details.sec, .fresh { border-color: transparent; box-shadow: var(--card-shadow); }
.stat, .list, .card, .upcoming, form.fields, .tbl-wrap { border-radius: 24px; }
.stat { padding: 18px 20px; }
.stat .label { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 500; color: var(--ink); }
.stat .value { font-size: 40px; font-weight: 300; line-height: 1.1; margin-top: 8px; }
.stat.lead { background: var(--lead-bg); border-color: rgba(255,255,255,.16); color: var(--lead-ink); box-shadow: 0 18px 40px rgba(5,15,45,.35); }
/* v121 (Cuong): the yearly and count cards take a lighter wash of the lead color so the top row blends with the header band, in every style. */
.stat.tint { background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.16)), var(--lead-bg); border-color: rgba(255,255,255,.2); color: var(--lead-ink); box-shadow: 0 12px 30px rgba(5,15,45,.22); }
.stat.tint .label { color: inherit; opacity: .9; }
.stat.lead .label { opacity: .9; }
.stat.lead .value { font-size: 54px; }
.stat.save .value { color: var(--good); }
.summary { gap: 14px; }
.kv .stat { border-radius: 18px; background: var(--bg); box-shadow: none; }
.kv .stat .value { font-size: 26px; }
.upcoming { padding: 18px 20px; }
.row { padding: 15px 18px; }
.row:hover, details.sec > summary:hover { background: var(--accent-soft); }
.logo { border-radius: 12px; }
.pill { padding: 4px 11px; font-weight: 600; }
.btn { border-radius: 99px; padding: 9px 18px; border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.ghost { background: none; }
.x-cat { border-radius: 99px; box-shadow: var(--card-shadow); border-color: transparent; }
.x-card { border-radius: 24px; }
.x-card:hover { border-color: transparent; box-shadow: 0 0 0 2px var(--sky-3), var(--card-shadow); }
.cat-item { border-radius: 16px; }
details.sec { border-radius: 18px; background: var(--surface); }
input, select { border-radius: 12px; border-color: var(--line); }
.sheet { border-radius: 28px 0 0 28px; background: var(--bg); }
.sheet .fresh, .sheet details.sec { background: var(--surface); }
.verdict { border-radius: 18px; }
.tip, .admin-note { border-radius: 16px; }
.seg { border-radius: 99px; border-color: transparent; background: var(--accent-soft); }
.seg button { border-radius: 99px; }

nav.tabs { background: var(--glass); border-color: transparent; border-radius: 99px; box-shadow: var(--card-shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
nav.tabs button { border-radius: 99px; display: inline-flex; align-items: center; gap: 7px; }
nav.tabs button[hidden] { display: none; }  /* v159: Admin and Shelf stay hidden unless turned on in the profile menu */
nav.tabs button { color: rgba(255,255,255,.82); }
nav.tabs button[aria-selected="true"] { background: #fff; color: #13296b; }
nav.tabs svg { width: 18px; height: 18px; flex: none; }
@media (max-width: 620px) {
  .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  header.top nav.tabs { justify-self: stretch; }
  /* Docked to the bottom edge on phones (Cuong, v85), not a floating pill. */
  nav.tabs { background: var(--tabbar); left: 0; right: 0; bottom: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-radius: 0; box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    border: 0; border-top: 1px solid var(--line); backdrop-filter: none; -webkit-backdrop-filter: none; }
  nav.tabs button { flex-direction: column; gap: 3px; padding: 8px 4px; font-size: 12px; color: var(--muted); border-radius: 14px; }
  nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
  nav.tabs svg { width: 22px; height: 22px; }
  .stat .value { font-size: 34px; }
  .stat.lead .value { font-size: 48px; }
  .sheet { border-radius: 0; }
}

/* Styles to choose from (Cuong, 2026-10-21, light-mode contrast). data-style picks the palette, data-mode is the
   light/dark the viewer actually sees (set by applyTheme), so each style can define both. */
:root[data-style="crisp"][data-mode="light"] {
  --bg: #f5f5f7; --surface: #ffffff; --line: #d2d2d7; --ink: #1d1d1f; --muted: #4f4f55;
  --accent: #0a58ca; --accent-soft: #e6effc; --hero-ink: #1d1d1f; --tabbar: rgba(255,255,255,.94);
  --lead-bg: linear-gradient(150deg, #0a58ca, #1f6fe0); --lead-ink: #ffffff; --card-shadow: 0 0 0 1px #e3e3e8, 0 2px 6px rgba(0,0,0,.04); }
:root[data-style="crisp"][data-mode="dark"] {
  --bg: #000000; --surface: #1c1c1e; --line: #38383a; --ink: #f5f5f7; --muted: #aeaeb2;
  --accent: #5ea2ff; --accent-soft: #10284a; --hero-ink: #f5f5f7; --tabbar: rgba(28,28,30,.94);
  --lead-bg: linear-gradient(150deg, #0a4fb8, #1f6fe0); --lead-ink: #ffffff; --card-shadow: none; }
:root[data-style="paper"][data-mode="light"] {
  --bg: #f3efe7; --surface: #fffdf9; --line: #ddd5c6; --ink: #211c16; --muted: #574e42;
  --accent: #9c3b22; --accent-soft: #f5e4dc; --hero-ink: #211c16; --tabbar: rgba(255,253,249,.94);
  --lead-bg: linear-gradient(150deg, #2a231c, #463a2e); --lead-ink: #fffaf2; --card-shadow: 0 0 0 1px #e6dfd2, 0 2px 8px rgba(60,40,20,.05); }
:root[data-style="paper"][data-mode="dark"] {
  --bg: #17140f; --surface: #221e18; --line: #3a332a; --ink: #f2ece2; --muted: #b8ad9c;
  --accent: #eb9a7d; --accent-soft: #3a241b; --hero-ink: #f2ece2; --tabbar: rgba(34,30,24,.94);
  --lead-bg: linear-gradient(150deg, #3a2e24, #55432f); --lead-ink: #fffaf2; --card-shadow: none; }
/* Crisp and Paper are flat: no navy band, the header sits on the page itself. */
:root[data-style="crisp"] body::before, :root[data-style="paper"] body::before,
:root[data-style="crisp"] body.short-band header.top::before, :root[data-style="paper"] body.short-band header.top::before { display: none; }
:root[data-style="crisp"] body.short-band header.top, :root[data-style="paper"] body.short-band header.top { margin-bottom: 8px; }
:root[data-style="crisp"] .hero p, :root[data-style="paper"] .hero p { color: var(--muted); opacity: 1; }
:root[data-style="crisp"] nav.tabs, :root[data-style="paper"] nav.tabs { background: var(--tabbar); }
:root[data-style="crisp"] nav.tabs button, :root[data-style="paper"] nav.tabs button { color: var(--muted); }
:root[data-style="crisp"] nav.tabs button[aria-selected="true"], :root[data-style="paper"] nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
:root[data-style="crisp"] .avatar, :root[data-style="paper"] .avatar { background: var(--accent); border-color: var(--surface); color: var(--surface); }
:root[data-style="crisp"] .hero h2 { font: 700 clamp(34px, 8vw, 48px)/1.08 var(--f-body); letter-spacing: -.03em; }
:root[data-style="crisp"] .section-head h2 { font: 700 22px/1.2 var(--f-body); letter-spacing: -.02em; }
/* Navy, light mode: stronger text on the grey page. */
:root[data-style="navy"][data-mode="light"] { --muted: #3f4a60; --line: #cfd6e2; --card-shadow: 0 0 0 1px #dbe1ea, 0 6px 18px rgba(16,40,90,.07); }
.styles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.style-opt { border: 2px solid transparent; border-radius: 18px; padding: 0; overflow: hidden; background: var(--surface); box-shadow: var(--card-shadow); text-align: left; display: grid; }
.style-opt[aria-pressed="true"] { border-color: var(--accent); }
.style-opt .sw { height: 58px; display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px; }
.style-opt .sw i { display: block; height: 18px; border-radius: 6px; }
.style-opt .nm { padding: 8px 12px 10px; display: grid; gap: 1px; }
.style-opt .nm b { font-size: 15px; }
.style-opt .nm span { font-size: 12px; color: var(--muted); line-height: 1.3; }

/* Help and Sam */
.top-btns { display: flex; gap: 10px; align-items: center; }
/* v99 (Cuong): subscription search in the header on every page, left of Help. */
.top-search { position: relative; }
.top-search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); pointer-events: none; color: #fff; }
.top-search input { width: 230px; height: 42px; border-radius: 21px; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.14); color: #fff; padding: 0 14px 0 38px; font: 15px var(--f-body); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.top-search input::placeholder { color: rgba(255,255,255,.8); }
.top-search input::-webkit-search-cancel-button { filter: invert(1); }
:root[data-style="crisp"] .top-search input, :root[data-style="paper"] .top-search input { background: var(--surface); color: var(--ink); border-color: var(--line); }
:root[data-style="crisp"] .top-search input::placeholder, :root[data-style="paper"] .top-search input::placeholder { color: var(--muted); }
:root[data-style="crisp"] .top-search svg, :root[data-style="paper"] .top-search svg { color: var(--accent); }
:root[data-style="crisp"] .top-search input::-webkit-search-cancel-button, :root[data-style="paper"] .top-search input::-webkit-search-cancel-button { filter: none; }
.tq-res { position: absolute; right: 0; top: 50px; width: min(360px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow: auto; z-index: 30; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.22); padding: 6px; }
.tq-res h4 { margin: 8px 10px 4px; font: 600 12px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tq-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 10px; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.tq-row:hover, .tq-row:focus-visible { background: var(--accent-soft); outline: none; }
.tq-row .logo { width: 30px; height: 30px; font-size: 12px; border-radius: 8px; flex: none; }
.tq-row span { min-width: 0; } .tq-row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tq-empty { padding: 10px; }
@media (max-width: 640px) {
  /* v100 (Cuong): phones get a full-width box on its own row under the title, Help and profile to its right. */
  header.top .brand { grid-column: 1 / -1; } header.top .top-btns { grid-column: 1 / -1; margin-top: 10px; }
  .top-search { flex: 1; } .top-search input { width: 100%; }
  .tq-res { left: 0; right: auto; width: calc(100vw - 32px); }
}
.help-btn { background: rgba(255,255,255,.14); }
:root[data-style="crisp"] .help-btn, :root[data-style="paper"] .help-btn { background: var(--surface); color: var(--accent); border-color: var(--line); }
.sam { gap: 12px; }
.sam-head { display: flex; align-items: center; gap: 12px; }
.sam-av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 14px var(--f-body); color: #fff; background: linear-gradient(150deg, #5b7bd5, #1e3a8a); }
.sam-av.lg { width: 44px; height: 44px; font-size: 18px; }

function logoHtml(v, cls = "logo") {
  const L = LOGOS[v.id];
  if (!L) return `<span class="${cls}" style="background:${v.color}" aria-hidden="true">${esc(v.mark)}</span>`;
  const n = parseInt(L.hex.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  // v85: Iconify bodies (CoreUI brands, Tabler brands, Material Design symbols) draw in currentColor at their own viewBox size.
  if (L.body) return `<span class="${cls}" style="background:${L.hex};color:${lum > 0.62 ? "#111" : "#fff"}" aria-hidden="true"><svg viewBox="0 0 ${L.vb || 24} ${L.vb || 24}">${L.body}</svg></span>`;
  return `<span class="${cls}" style="background:${L.hex}" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="${lum > 0.62 ? "#111" : "#fff"}" d="${L.d}"/></svg></span>`;
}

function policyText(pp) {

function verdictText(s, r) {
  if (r.paused) { const cp = currentPause(s);
    return `Paused since ${fmtDate(cp.from)}.${cp.fee ? ` You pay ${money(cp.fee)}/mo to keep it on hold.` : " You pay nothing while it's paused."}${cp.restartFee ? ` Restarting costs ${money(cp.restartFee)}.` : ""}${cp.to ? ` It restarts on ${fmtDate(cp.to)}.` : " If you don't miss it, cancelling may be better than restarting."}`; }
  if (introActive(s) && s.uses && regularTotal(s) != null) { const cpu = monthlyOf(s, regularTotal(s)) / s.uses;
    return `Good deal for now. When the ${s.intro.kind === "trial" ? "trial" : "intro price"} ends, each use will cost ${money(cpu)}. Decide before ${fmtDate(s.intro.ends)}.`; }
  if (r.needs) return `Enter what you pay in the price check below so we can rate this subscription.`;
  if (r.free) return `It's free, so it's great value whenever you use it.`;
  if (r.waiting) return `Tell us how often you use it under How you use it below. Once we know, we'll tell you whether it's worth what you pay and suggest ways to save.`;
  const v = svcOf(s), feats = featuresFor(v, s.plan), plan = planOf(v, s.plan);
  const cheaper = v.plans.filter(p => p.effective_monthly < (plan?.effective_monthly ?? 0)).sort((a, b) => a.effective_monthly - b.effective_monthly)[0];
  if (r.bundle) { const m = measureOf(s);
    return `Without ${esc(s.name)} you'd pay about ${money(r.val)} a month: ${money(m.worth)} shipping on ${fmtN(s.uses)} order${s.uses === 1 ? "" : "s"} under $35${m.counted.map(p => ` plus ${partText(p)}`).join("")}${m.counted.some(p => p.months) ? ` (about ${money(m.fixedAdd)} a month averaged over the year)` : ""}${m.included.length ? `. ${m.included.map(p => p.name).join(" and ")} is included in Prime Video's ${money(m.counted.find(c => c.feature === m.included[0].within)?.monthly)}` : ""}. It costs ${money(monthly(s))}${(s.members || 1) > 1 ? `, or ${money(monthly(s) / s.members)} for each of the ${s.members} people sharing it` : ""}.${r.key === "poor" ? " Grouping orders to $35 or more gets free shipping without Prime." : ""}`; }
  if (r.fixed && !r.idle) { const m = measureOf(s), a = altOf(s), d = monthly(s) - m.worth, extras = feats.filter(f => f.id !== m.job);
    const mine = s.used.filter(id => id !== m.job).map(id => feats.find(f => f.id === id)?.name).filter(Boolean);
    return d <= 0.005 ? `${esc(s.name)} costs less than ${m.jobName} alone (${money(m.worth)}/mo at ${a?.name.split(",")[0] || "the cheapest option"}), so everything else is a bonus.`
      : `You pay ${money(d)}/mo more than ${m.jobName} alone would cost${a ? ` at ${a.name.split(",")[0]}` : ""}. ${mine.length ? `That buys the extras you care about: ${mine.join(", ")}.` : `If you don't need the extras (${extras.slice(0, 3).map(f => f.name.toLowerCase()).join(", ")}${extras.length > 3 ? " and more" : ""}), switching would save ${money(d * 12)} a year.`}`; }
  if (r.insure) { const q = s.quote, by = q && (CATALOG[q.by]?.name.replace(/ \((Car|Home)\)$/, "") || q.name || "another insurer"), old = q?.date && q.date < addMonths(-12);
    const svc = r.mine === "below" ? (s.service === "poor" ? "you rated its claims and support as poor" : "its published service rating is below average") : r.mine === "above" ? (s.service === "good" ? "you rated its claims and support as good" : "its published service rating is above average") : "";
    if (!q || r.quote == null) return `Value here means the best price for the same coverage and terms, with good service. Get two or three quotes for exactly your coverage (same limits, deductibles and drivers or home) and enter the best one under How it compares.`;
    const stale = old ? ` Your quote is over a year old, so get a fresh one.` : "";
    if (r.key === "poor") return `You pay ${money(r.over)} a month (${money(r.over * 12)} a year) more than ${esc(by)} quoted for the same coverage${r.theirs === "below" ? `, though ${esc(by)}'s service rating is below average` : ""}. Ask ${esc(s.name.replace(/ \((Car|Home)\)$/, ""))} to match it, or switch at renewal.${stale}`;
    if (r.key === "ok" && r.over > 0) return `You pay ${money(r.over)} a month more than ${esc(by)}'s quote, but ${svc || "your insurer's service is rated better"}, and ${esc(by)}'s is ${BAND_LABEL[r.theirs]?.toLowerCase() || "lower"}. Paying a little more for claims that go smoothly can be worth it.${stale}`;
    if (r.key === "ok") return `Your price is as good as or better than ${esc(by)}'s quote, but ${svc}. Cheap isn't great value if a claim goes badly, so compare a quote from an insurer with better service.${stale}`;
    return `Your price is as good as or better than ${esc(by)}'s quote for the same coverage${svc ? `, and ${svc}` : ""}. That's great value.${stale}`; }
  if (r.results) { const m = measureOf(s), fp = fairPrice(s), thing = m.lawn ? (m.pest ? "pests" : "weeds or lawn problems") : "problems", range = fp ? `${money(fp.lo)} to ${money(fp.hi)}` : "";
    const c = r.cmp, by = c && (CATALOG[s.quote.by]?.name || "the option you found"), svc = serviceOf(s);
    if (r.unfixed) return m.lawn ? `You reported a problem that still isn't fixed. Ask ${esc(s.name)} for a free re-treatment (most plans include one). If it isn't sorted out, it's not giving you what you pay for, so get quotes from other companies.`
      : `You reported a problem that still isn't fixed. If ${esc(s.name)} can't sort it out, it isn't doing the job you pay ${money(monthly(s))} a month for, so look at other options.`;
    if (r.key === "poor" && !c?.cheaper && !c?.betterSame) return `You had to ${m.lawn ? "call them back" : "contact support"} in ${r.calls} of the last 3 months. If the ${thing} keep coming back, it may not be worth ${money(monthly(s))} a month.${m.lawn ? " Ask for a re-treatment or compare quotes." : " Compare other options."}`;
    if (c?.cheaper) return `${esc(by)} costs ${money(c.over)} a month less (${money(c.over * 12)} a year) for a comparable service${c.theirs ? `, with ${BAND_LABEL[c.theirs].toLowerCase()} service` : ""}. A cheaper option that's just as good makes this costly, however much you use it. Ask ${esc(s.name)} to match it, or switch.`;
    if (c?.betterSame) return `${esc(by)} costs about the same and its service is rated ${BAND_LABEL[c.theirs].toLowerCase()}, better than ${esc(s.name)}'s. Better service for the same price makes this costly. Consider switching.`;
    if (c?.paysForService) return `You pay ${money(c.over)} a month more than ${esc(by)}, but ${esc(s.name)}'s service is rated better. Paying a little more for service that works can be worth it.`;
    if (r.pricey) return `No unresolved problems lately, but ${money(monthly(s))} a month is above the typical ${range} for ${r.pricey.what}, based on ${esc(r.pricey.src)}. Ask for a better rate, or get a quote or two before you renew.`;
    if (r.key === "ok" && svc === "below") return `It's working, but ${s.service === "poor" ? "you rated its service as poor" : "its published service rating is below average"}. A comparable option with better service at the same price would make this costly, so it's worth comparing.`;
    if (r.unchecked) return `No unresolved problems in the last 3 months, so it's doing its job. To call it great value we also need a price check: add the cheapest comparable option you've found under How it's going. If it's cheaper, or has better service for the same price, this becomes costly.`;
    return `No unresolved ${thing} in the last 3 months${r.calls ? ", and the problem you raised was fixed" : ""}${c ? `, and nothing comparable you've found beats its price and service` : fp ? monthly(s) < fp.lo ? `, for less than the typical ${range} a month` : `, at a fair price (typically ${range} a month)` : ""}. That's great value.`; }
  if (r.perks) return `Over the last 12 months you used ${money(r.val)} of perks on a card that cost ${money(r.cost)}.${r.key === "poor" ? " The perks don't cover the fee, so a no-fee card may be better." : r.key === "ok" ? " That about covers the fee." : " The perks more than pay for it."}`;
  if (r.early) return `${esc(s.name)} was added less than ${NEW_DAYS} days ago, so it's too soon to call it costly. Keep your usage up to date and we'll rate it after its first month.`;
  if (r.idle) return `No use in the last 12 months (0 ${esc(measureOf(s).short)}). A subscription you haven't used in a year probably isn't worth ${money(monthly(s) * 12)} a year. Cancel it, or record your usage if that's wrong.`;
  if (r.noRoadside) return `No roadside calls in the last 12 months${r.checksUsed ? ", only other member benefits" : ""}. Roadside help is the main reason to have ${esc(s.name)}, so you paid ${money(monthly(s) * 12)} over the year for help you didn't use. Tick a roadside call under How you use it if you had one, or compare a cheaper plan or roadside cover from your car insurer.`;
  if (r.roadside) return `You used roadside help in the last 12 months. We count ${esc(s.name)} as worth it in any year with at least one roadside call.`;
  if (r.checksUsed) return `No roadside calls in the last 12 months, but you used other member benefits. One roadside call in a year would make it clearly worth it.`;
  if (s.svc === "aaa" && r.model === "insurance") return `Nothing used in the last 12 months. That's fine for protection, but one roadside call in a year is what makes it clearly worth it. Tick what you use each month under How you use it.`;
  if (["car_insurance", "home_insurance"].includes(svcOf(s).category)) return `Insurance prices change at every renewal. Get two or three quotes about a month before yours renews, and ask about bundling home and auto.`;
  if (r.model === "insurance") return `You pay for protection, not daily use. Check the Savings tab to see if another subscription already covers the same things.`;
  if (r.model === "storage") return `Judge this by how much you store. Pick the smallest plan that fits your photos and backups.`;
  if (r.model === "perks") return `Each month, set the dollar value of the perks you used (free bags, points, credits). If they add up to less than ${money(monthly(s))} a month, the fee isn't paying off.`;

const APP_VERSION = "Prototype · Version 189 · Oct 26", VERSION_NUM = 189;
// Auto-update (Cuong, v134): a home-screen icon on iPhone can keep showing a saved copy of the public site. On opening, and
// whenever the app comes back to the screen, ask the site for its version; if it's newer, reload past the saved copy.
// Public site only (the Claude artifact always serves the latest). One try per version, so a slow cache can't loop.
function checkForUpdate() {
  if (!/github\.io$/.test(location.hostname)) return;
  fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(t => {
    const n = +(t.match(/VERSION_NUM = (\d+)/) || [])[1];
    if (!(n > VERSION_NUM)) return;
    try { if (sessionStorage.getItem("sk-upd") === String(n)) return; sessionStorage.setItem("sk-upd", String(n)); } catch {}
    location.replace(location.pathname + "?v=" + n);
  }).catch(() => {});
}
